bundle:
  name: restaurant_chain_analytics

include:
  - resources/ingestion/**/*.yml
  - resources/transformation/**/*.yml
  - resources/orchestration/**/*.yml
  - resources/dashboards/**/*.yml
  - config/**/*.yml

variables:
  catalog:
    description: Unity Catalog catalog
    default: databricksproject_ws

  bronze_schema:
    description: Bronze schema
    default: 01_bronze

  silver_schema:
    description: Silver schema
    default: 02_silver

  gold_schema:
    description: Gold schema
    default: 03_gold

  failure_email:
    description: Failure notification email
    default: talarirahulmanidatta@gmail.com

  secret_scope:
    description: Secret scope
    default: restaurantproject

  sql_connection:
    description: Azure SQL UC Connection
    default: conn_restaurantops

  source_catalog:
    description: Source SQL Database
    default: restaurantops

  source_schema:
    description: Source SQL Schema
    default: dbo

  governance_schema:
    description: Schema for access-control functions and the restaurant_access mapping
    default: 04_governance

  secure_schema:
    description: Schema for restaurant-scoped, PII-masked dynamic views
    default: 05_secure

  owners_group:
    description: Account group with enterprise-wide, unmasked access
    default: restaurant_owners

  analysts_group:
    description: Account group with restaurant-scoped, PII-masked access
    default: restaurant_analysts

  engineers_group:
    description: Account group that builds and operates the pipelines
    default: data_engineers

  dq_alert_threshold:
    description: The dq_alert task fails when more rows than this are quarantined in one run
    default: 0

  warehouse_id:
    description: SQL warehouse that runs the AI/BI dashboard queries
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    mode: development
    default: true

    workspace:
      host: https://adb-7405609208650840.0.azuredatabricks.net

    variables:
      catalog: databricksproject_ws

  prod:
    mode: production

    workspace:
      host: https://adb-7405609208650840.0.azuredatabricks.net

    variables:
      catalog: databricksproject_ws_prod
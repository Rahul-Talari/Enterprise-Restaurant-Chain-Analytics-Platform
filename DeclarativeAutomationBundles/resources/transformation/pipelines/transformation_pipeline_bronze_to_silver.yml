resources:
  pipelines:
    transformation_pipeline_bronze_to_silver:
      name: transformation_pipeline_bronze_to_silver

      catalog: ${var.catalog}
      schema: ${var.silver_schema}

      serverless: true
      continuous: false  # triggered: master_job runs it hourly; a continuous pipeline never finishes, which blocks downstream tasks

      configuration:
        catalog: ${var.catalog}
        bronze_schema: ${var.bronze_schema}

      libraries:
        - file:
            path: ../../../sources/2_transformation_pipeline_bronze_to_silver/transformations/dimensional_tables.py
        - file:
            path: ../../../sources/2_transformation_pipeline_bronze_to_silver/transformations/fact_orders.py
        - file:
            path: ../../../sources/2_transformation_pipeline_bronze_to_silver/transformations/fact_order_items.py
        - file:
            path: ../../../sources/2_transformation_pipeline_bronze_to_silver/transformations/fact_reviews.sql
